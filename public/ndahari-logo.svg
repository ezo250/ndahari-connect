<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- White background -->
  <rect width="400" height="400" fill="white"/>

  <!-- N letter left vertical bar -->
  <rect x="80" y="60" width="48" height="160" rx="10" fill="#1a3a8f"/>

  <!-- N letter diagonal bar -->
  <polygon points="80,60 128,60 248,200 248,220 200,220 80,80" fill="#1a3a8f"/>

  <!-- N letter right vertical - door shape -->
  <rect x="200" y="60" width="48" height="160" rx="10" fill="#1a3a8f"/>
  <!-- Door detail on right bar -->
  <rect x="204" y="64" width="40" height="152" rx="8" fill="#2952cc"/>
  <!-- Door knob -->
  <circle cx="216" cy="148" r="5" fill="white"/>
  <!-- Door frame line -->
  <line x1="244" y1="64" x2="244" y2="216" stroke="#1a3a8f" stroke-width="3"/>

  <!-- Person icon inside N -->
  <circle cx="152" cy="118" r="18" fill="#2952cc"/>
  <path d="M128 170 Q152 155 176 170" stroke="#2952cc" stroke-width="12" fill="none" stroke-linecap="round"/>

  <!-- NDAHARI text -->
  <text x="200" y="290" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="64" fill="#1a3a8f" text-anchor="middle" letter-spacing="2">Ndahari</text>

  <!-- Tagline -->
  <line x1="60" y1="318" x2="120" y2="318" stroke="#1a3a8f" stroke-width="2"/>
  <text x="200" y="325" font-family="Arial, sans-serif" font-weight="600" font-size="14" fill="#1a3a8f" text-anchor="middle" letter-spacing="1">AKAZI KURI BOSE, AMAHAHIRWE KU BOSE.</text>
  <line x1="280" y1="318" x2="340" y2="318" stroke="#1a3a8f" stroke-width="2"/>
</svg>
